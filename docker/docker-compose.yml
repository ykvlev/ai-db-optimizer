# Программа целиком: интерфейс и сервер (app, http://localhost:8080) и тестовые СУБД с демонстрационной БД
# «shop» (детерминированные данные, seed v1). Запуск одной командой (или двойным щелчком по Запустить.cmd):
#   docker compose -f docker/docker-compose.yml up -d --build
# Только базы данных (для запуска сервера из исходников):  ... up -d mysql postgres
# Подключение для анализа (только SELECT): user optimizer_ro / optimizer_ro
name: ai-db-optimizer   # имя группы контейнеров в Docker Desktop

services:
  app:
    build:
      context: ..
      dockerfile: docker/app.Dockerfile
    image: aidbo-app
    container_name: aidbo-app
    ports:
      - "8080:8000"
    env_file:
      - path: ../backend/.env        # ключи GigaChat и других моделей (необязательно)
        required: false
    environment:
      # базы на компьютере пользователя (127.0.0.1:3307 и т. п.) доступны из контейнера по адресу хоста
      LOCALHOST_ALIAS: host.docker.internal
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - app-data:/app/backend/data   # история анализов и экспериментов сохраняется между запусками
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: aidbo-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: shop
    ports:
      - "3307:3306"
    volumes:
      - ./mysql:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    command: ["--innodb-buffer-pool-size=512M", "--character-set-server=utf8mb4"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-prootpass"]
      interval: 5s
      retries: 60

  postgres:
    image: postgres:16
    container_name: aidbo-postgres
    environment:
      POSTGRES_PASSWORD: rootpass
      POSTGRES_DB: shop
    ports:
      - "5434:5432"
    volumes:
      - ./postgres:/docker-entrypoint-initdb.d:ro
      - pg-data:/var/lib/postgresql/data
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "work_mem=8MB", "-c", "shared_preload_libraries=pg_stat_statements"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "shop"]
      interval: 5s
      retries: 60

volumes:
  app-data:
    name: aidbo-app-data
  mysql-data:
    name: aidbo-mysql-data
  pg-data:
    name: aidbo-pg-data
