name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: frontend/dist
          if-no-files-found: error

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Start isolated test databases
        run: docker compose -f docker/docker-compose.yml up -d --wait --wait-timeout 180 mysql postgres
      - name: Backend and database integration tests
        working-directory: backend
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Require database tests to execute
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = [c for c in ET.parse('backend/test-results.xml').iter('testcase')
                   if 'test_integration' in c.attrib.get('classname', '')]
          assert cases, 'No database integration tests collected'
          assert not any(c.find('skipped') is not None for c in cases), 'Database integration tests skipped'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: backend/test-results.xml
      - name: Database logs on failure
        if: failure()
        run: docker compose -f docker/docker-compose.yml logs mysql postgres
      - name: Stop disposable test databases
        if: always()
        run: docker compose -f docker/docker-compose.yml down --volumes

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package the tested commit
        run: docker build -f docker/app.Dockerfile --label org.opencontainers.image.source=https://github.com/${{ github.repository }} --label org.opencontainers.image.revision=${{ github.sha }} -t optimizer:${{ github.sha }} .
      - name: Check packaged application
        run: |
          docker run -d --name package-check -p 127.0.0.1:18080:8000 optimizer:${{ github.sha }}
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/api/health; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true
          curl --fail --silent http://127.0.0.1:18080/ > /tmp/frontend.html
          grep -q '<div id="root"' /tmp/frontend.html
      - name: Package logs on failure
        if: failure()
        run: docker logs package-check
      - name: Save the verified image
        run: docker save optimizer:${{ github.sha }} | gzip > optimizer.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: container
          path: optimizer.tar.gz
          retention-days: 7
          compression-level: 0

  registry:
    needs: package
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: container
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the same verified image
        env:
          COMMIT: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          IMAGE="ghcr.io/${REPOSITORY,,}:sha-${COMMIT}"
          gzip -dc optimizer.tar.gz | docker load
          docker tag "optimizer:${COMMIT}" "$IMAGE"
          docker push "$IMAGE"
          docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE" > image.txt
          grep -Eq '^ghcr.io/[^ ]+@sha256:[0-9a-f]{64}$' image.txt
          cat image.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: release-image
          path: image.txt
          if-no-files-found: error
